name: Continuous Integration (CI)

on:
  push:
    branches:
      - actions
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Code Quality, Typecheck & Builds
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile --prefer-offline || pnpm install

      - name: Build TypeScript Libraries
        run: |
          echo "Building shared TypeScript libraries..."
          pnpm run typecheck:libs

      - name: Validate Frontend TypeScript
        run: |
          echo "Validating TypeScript for @workspace/twirldrape (React + Vite)..."
          pnpm --filter @workspace/twirldrape run typecheck

      - name: Build Express Backend API
        run: |
          echo "Compiling backend API server bundle..."
          pnpm --filter @workspace/api-server run build

      - name: Build React Frontend
        run: |
          echo "Compiling Vite frontend production bundle..."
          pnpm --filter @workspace/twirldrape run build

      - name: Validate Build Outputs
        run: |
          echo "Checking compilation outputs..."
          test -f artifacts/api-server/dist/index.mjs || { echo "Backend build output missing!"; exit 1; }
          test -f artifacts/vastraa/dist/public/index.html || { echo "Frontend build output missing!"; exit 1; }
          echo "Build validation succeeded!"

